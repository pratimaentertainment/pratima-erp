  <text x="385" y="567" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="900">✨</text>
  <text x="415" y="557" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Instant AI Guest Photo Finder</text>
  <text x="415" y="575" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Guests upload a quick selfie to discover their wedding photos in under 2 seconds. Included free in Higher Plan.</text>
